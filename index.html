<style>
/* ==================================================================
   NASOFT — design system
   ================================================================== */
:root {
  --black: #050607;
  --surface: #0a0d10;
  --surface-2: #0f1418;
  --white: #ffffff;
  --text: rgba(255,255,255,.92);
  --muted: rgba(225,230,232,.68);
  --border: rgba(255,255,255,.12);
  --blue: #4da3ff;
  --cyan: #63d8ff;

  --glass-bg: linear-gradient(145deg, rgba(24,30,34,.72), rgba(6,11,14,.84));
  --glass-border: 1px solid rgba(255,255,255,.13);
  --glass-shadow: 0 2px 20px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.025) inset;
  --glass-blur: blur(16px) saturate(110%);

  --gutter: clamp(20px, 4.2vw, 88px);
  --shell: 1240px;
  --radius: 14px;
  --radius-lg: 20px;

  --section-y: clamp(64px, 9vh, 128px);
  --ease: cubic-bezier(.16,1,.3,1);

  --display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  background: var(--black);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

img, svg, video { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
  border-radius: 4px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 200;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--white);
  color: #06090b;
  font-weight: 600;
  transition: top 180ms var(--ease);
}
.skip-link:focus { top: 12px; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------------------
   Cinematic background
   ------------------------------------------------------------------ */
.backdrop {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: var(--black);
  pointer-events: none;
}

.backdrop video,
.backdrop .backdrop-fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  user-select: none;
  -webkit-user-select: none;
}

/* Static fallback for devices where video is unavailable or costly. */
.backdrop .backdrop-fallback {
  background:
    radial-gradient(60% 46% at 24% 30%, rgba(77,163,255,.22), transparent 72%),
    radial-gradient(52% 44% at 76% 66%, rgba(99,216,255,.16), transparent 72%),
    radial-gradient(70% 58% at 50% 50%, rgba(18,28,38,.9), var(--black) 80%);
}

.backdrop::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(5,6,7,.62), rgba(5,6,7,.34) 26%, rgba(5,6,7,.52) 72%, rgba(5,6,7,.9)),
    radial-gradient(ellipse at 44% 52%, transparent 26%, rgba(5,6,7,.72) 100%);
}

/* Content scrim keeps long-form text readable further down the page. */
.page-scrim {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background: var(--black);
  opacity: 0;
  transition: opacity 420ms linear;
}
.scrolled-deep .page-scrim { opacity: .74; }

/* ------------------------------------------------------------------
   Layout primitives
   ------------------------------------------------------------------ */
.shell {
  width: 100%;
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.section { padding-block: var(--section-y); }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .02em;
  color: var(--cyan);
}
.eyebrow::before {
  content: "";
  width: 18px;
  height: 1px;
  background: currentColor;
  opacity: .7;
}

h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.08;
  margin: 0;
  color: var(--white);
}

h1 { font-size: clamp(38px, 6.4vw, 78px); }
h2 { font-size: clamp(28px, 3.9vw, 46px); letter-spacing: -.024em; }
h3 { font-size: clamp(19px, 1.5vw, 22px); letter-spacing: -.012em; line-height: 1.25; }
h4 { font-size: 16px; font-weight: 600; letter-spacing: -.008em; }

p { margin: 0; }

.lede {
  color: var(--muted);
  font-size: clamp(16px, 1.2vw, 18px);
  line-height: 1.66;
  max-width: 62ch;
}

.section-head {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: clamp(32px, 4vh, 54px);
  max-width: 68ch;
}

.grid { display: grid; gap: clamp(14px, 1.5vw, 20px); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* ------------------------------------------------------------------
   Glass
   ------------------------------------------------------------------ */
.glass {
  background: var(--glass-bg);
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-radius: var(--radius-lg);
}

.panel { padding: clamp(20px, 2.4vw, 32px); }

/* ------------------------------------------------------------------
   Buttons
   ------------------------------------------------------------------ */
.btn {
  --btn-bg: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 46px;
  padding: 12px 20px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: var(--btn-bg);
  font-family: var(--body);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -.005em;
  cursor: pointer;
  text-align: center;
  transition: filter 160ms var(--ease), transform 160ms var(--ease),
              border-color 160ms var(--ease), opacity 160ms;
}

.btn:hover:not(:disabled) { filter: brightness(1.09); }
.btn:active:not(:disabled) { transform: translateY(1px); }

.btn:disabled,
.btn[aria-disabled="true"] { opacity: .48; cursor: not-allowed; filter: none; }

.btn--primary {
  --btn-bg: var(--white);
  color: #07090b;
  font-weight: 600;
  box-shadow: 0 1px 6px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.7);
}

.btn--ghost {
  --btn-bg: linear-gradient(145deg, rgba(24,30,34,.72), rgba(6,11,14,.84));
  border-color: rgba(255,255,255,.16);
  color: var(--text);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}

.btn--quiet { padding-inline: 4px; min-height: 40px; color: var(--muted); }
.btn--quiet:hover { color: var(--white); }

.btn--danger { border-color: rgba(255,120,120,.34); color: #ffb4b4; }

.btn--block { width: 100%; }
.btn--sm { min-height: 38px; padding: 8px 14px; font-size: 14px; }

.btn .spinner {
  width: 15px; height: 15px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  animation: spin 640ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ------------------------------------------------------------------
   Header
   ------------------------------------------------------------------ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 60;
  border-bottom: 1px solid transparent;
  transition: background-color 260ms var(--ease), border-color 260ms var(--ease);
}

.site-header.is-stuck {
  background: rgba(6,9,11,.72);
  border-bottom-color: var(--border);
  backdrop-filter: blur(18px) saturate(110%);
  -webkit-backdrop-filter: blur(18px) saturate(110%);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: clamp(16px, 2vw, 34px);
  min-height: 72px;
  position: relative;
}

.brand {
  display: inline-flex;
  align-items: center;
  flex: none;
}

/* The logo is a wordmark, so it carries the name on its own — no text beside it. */
.brand img {
  height: 26px;
  width: auto;
  flex: none;
  /* Lifts the deep blue of the N away from the near-black backdrop. */
  filter: drop-shadow(0 1px 10px rgba(77,163,255,.28));
}

.brand--footer img { height: 24px; }

@media (max-width: 420px) {
  .brand img { height: 22px; }
}

.header-panel { display: flex; align-items: center; flex: 1; min-width: 0; }

.nav { display: flex; align-items: center; gap: clamp(14px, 1.5vw, 26px); }

.nav a {
  position: relative;
  padding: 6px 2px;
  font-size: 14.5px;
  color: rgba(229,232,234,.72);
  transition: color 160ms var(--ease);
  white-space: nowrap;
}
.nav a:hover { color: var(--white); }
.nav a[aria-current="page"] { color: var(--white); }
.nav a[aria-current="page"]::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -2px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--blue), var(--cyan));
}

.header-cta { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.menu-toggle {
  display: none;
  place-items: center;
  width: 46px; height: 46px;
  margin-left: auto;
  border-radius: 12px;
  border: var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  cursor: pointer;
}
.menu-toggle .bar { transition: transform 260ms var(--ease); transform-origin: center; }
.site-header.menu-open .menu-toggle .bar-top { transform: translateY(3.5px) rotate(45deg); }
.site-header.menu-open .menu-toggle .bar-bottom { transform: translateY(-3.5px) rotate(-45deg); }

/* ------------------------------------------------------------------
   Hero
   ------------------------------------------------------------------ */
.hero {
  padding-block: clamp(48px, 9vh, 120px) clamp(56px, 10vh, 132px);
  display: grid;
  gap: clamp(36px, 5vw, 64px);
  grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr);
  align-items: center;
}

.hero-copy { max-width: 640px; }

.hero h1 {
  font-weight: 600;
  letter-spacing: -.032em;
  line-height: 1.02;
  text-shadow: 0 2px 18px rgba(0,0,0,.5);
}

.hero h1 .line { display: block; overflow: hidden; }
.hero h1 .line-reveal { display: block; }
.hero h1 .line-two {
  background: linear-gradient(94deg, #ffffff 16%, var(--cyan) 96%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero .lede {
  margin-top: clamp(18px, 2.4vh, 26px);
  font-size: clamp(16px, 1.25vw, 18.5px);
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}

.hero .btn-row { margin-top: clamp(26px, 3.4vh, 38px); }

.hero-note {
  margin-top: 22px;
  font-size: 13.5px;
  color: rgba(225,230,232,.56);
  max-width: 46ch;
}

.flow { padding: clamp(22px, 2.4vw, 30px); display: flex; flex-direction: column; gap: 4px; }

.flow-title {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .04em;
  color: rgba(225,230,232,.6);
  margin-bottom: 14px;
}

.flow-step {
  position: relative;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 14px;
  padding: 13px 0;
}

.flow-step + .flow-step::before {
  content: "";
  position: absolute;
  left: 16.5px;
  top: -14px;
  width: 1px;
  height: 28px;
  background: linear-gradient(180deg, rgba(99,216,255,.05), rgba(99,216,255,.42));
}

.flow-node {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid rgba(99,216,255,.3);
  background: radial-gradient(circle at 34% 28%, rgba(99,216,255,.22), rgba(6,11,14,.7));
  font-size: 12px;
  font-weight: 600;
  font-family: var(--display);
  color: var(--cyan);
}

.flow-step h4 { margin-bottom: 3px; }
.flow-step p { font-size: 14px; color: var(--muted); line-height: 1.5; }

/* ------------------------------------------------------------------
   Cards
   ------------------------------------------------------------------ */
.card {
  position: relative;
  padding: clamp(20px, 1.9vw, 26px);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(150deg, rgba(20,26,30,.6), rgba(6,10,13,.76));
  backdrop-filter: blur(14px) saturate(108%);
  -webkit-backdrop-filter: blur(14px) saturate(108%);
  transition: border-color 220ms var(--ease), transform 220ms var(--ease);
  height: 100%;
}
.card:hover { border-color: rgba(99,216,255,.34); transform: translateY(-3px); }

.card-icon {
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  margin-bottom: 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(99,216,255,.07);
  color: var(--cyan);
}
.card-icon svg { width: 19px; height: 19px; }

.card h3 { margin-bottom: 8px; font-size: 17.5px; }
.card p { font-size: 14.5px; color: var(--muted); line-height: 1.58; }

.step {
  position: relative;
  padding: clamp(22px, 2vw, 30px);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(150deg, rgba(20,26,30,.58), rgba(6,10,13,.76));
  backdrop-filter: blur(14px) saturate(108%);
  -webkit-backdrop-filter: blur(14px) saturate(108%);
  height: 100%;
}
.step-num {
  font-family: var(--display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--cyan);
  margin-bottom: 14px;
  display: block;
}
.step h3 { margin-bottom: 9px; }
.step p { font-size: 14.5px; color: var(--muted); }

/* Notices */
.notice {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 18px 20px;
  border-radius: var(--radius);
  border: 1px solid rgba(99,216,255,.24);
  background: rgba(15,32,44,.5);
  font-size: 14.5px;
  line-height: 1.6;
  color: rgba(228,236,240,.86);
}
.notice svg { flex: none; width: 18px; height: 18px; color: var(--cyan); margin-top: 2px; }
.notice--warn { border-color: rgba(255,196,120,.3); background: rgba(40,30,14,.48); }
.notice--warn svg { color: #ffc478; }
.notice--error { border-color: rgba(255,130,130,.34); background: rgba(44,16,18,.5); }
.notice--error svg { color: #ff9a9a; }
.notice--success { border-color: rgba(120,238,180,.3); background: rgba(12,38,28,.5); }
.notice--success svg { color: #7bf0b4; }

/* ------------------------------------------------------------------
   Forms
   ------------------------------------------------------------------ */
.form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 7px; }

.field label { font-size: 14px; font-weight: 500; color: rgba(238,242,244,.9); }
.field .hint { font-size: 13px; color: rgba(225,230,232,.55); line-height: 1.5; }

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: rgba(6,10,13,.66);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
}

.field textarea { resize: vertical; min-height: 128px; }
.field input::placeholder,
.field textarea::placeholder { color: rgba(225,230,232,.38); }

.field input:hover, .field textarea:hover, .field select:hover { border-color: rgba(255,255,255,.2); }

.field input:focus, .field textarea:focus, .field select:focus {
  outline: none;
  border-color: var(--cyan);
  background: rgba(8,14,18,.85);
}

.field input[aria-invalid="true"],
.field textarea[aria-invalid="true"],
.field select[aria-invalid="true"] { border-color: #ff8a8a; }

.field-error {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #ff9a9a;
}
.field-error::before { content: "!"; font-weight: 700; }

.field input:disabled, .field textarea:disabled, .field select:disabled { opacity: .55; cursor: not-allowed; }

.readonly-pair {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(6,10,13,.5);
}
.readonly-pair .k { font-size: 12.5px; color: rgba(225,230,232,.55); margin-bottom: 3px; }
.readonly-pair .v { font-size: 15px; color: var(--white); word-break: break-word; }

.form-actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 4px; }

.auth-shell { max-width: 470px; margin-inline: auto; }
.auth-shell h1 { font-size: clamp(30px, 3.6vw, 40px); }
.auth-alt { margin-top: 20px; font-size: 14px; color: var(--muted); text-align: center; }
.auth-alt a { color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; }

/* ------------------------------------------------------------------
   Status pills — shape + glyph + label, never colour alone
   ------------------------------------------------------------------ */
.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 11px 5px 9px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
}
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.status .glyph { font-size: 11px; font-weight: 700; }

.status--submitted { color: #b6c6d2; }
.status--review    { color: #7fc0ff; border-color: rgba(127,192,255,.28); }
.status--needsinfo { color: #ffc478; border-color: rgba(255,196,120,.32); }
.status--accepted  { color: #7bf0b4; border-color: rgba(123,240,180,.28); }
.status--progress  { color: #63d8ff; border-color: rgba(99,216,255,.3); }
.status--waiting   { color: #ffc478; border-color: rgba(255,196,120,.32); }
.status--resolved  { color: #7bf0b4; border-color: rgba(123,240,180,.3); }
.status--closed    { color: #8b98a2; }

/* ------------------------------------------------------------------
   Dashboard
   ------------------------------------------------------------------ */
.dash-head {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 32px;
}

.sub-list { display: flex; flex-direction: column; gap: 12px; }

.sub-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 14px 20px;
  align-items: center;
  padding: 18px 20px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: linear-gradient(150deg, rgba(20,26,30,.58), rgba(6,10,13,.76));
  backdrop-filter: blur(14px) saturate(108%);
  -webkit-backdrop-filter: blur(14px) saturate(108%);
  transition: border-color 200ms var(--ease), transform 200ms var(--ease);
}
.sub-row:hover { border-color: rgba(99,216,255,.3); transform: translateY(-2px); }

.sub-row .id {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12.5px;
  color: var(--cyan);
}
.sub-row h3 { font-size: 17px; margin: 5px 0 7px; }
.sub-row .meta {
  font-size: 13px;
  color: rgba(225,230,232,.56);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}
.sub-row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

.empty-state {
  padding: clamp(32px, 5vw, 56px);
  text-align: center;
  border-radius: var(--radius-lg);
  border: 1px dashed rgba(255,255,255,.16);
  background: rgba(6,10,13,.42);
}
.empty-state h3 { margin-bottom: 10px; }
.empty-state p { color: var(--muted); max-width: 44ch; margin-inline: auto; margin-bottom: 22px; }

.timeline { display: flex; flex-direction: column; }
.tl-item {
  position: relative;
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 16px;
  padding-bottom: 24px;
}
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: "";
  position: absolute;
  left: 12.5px;
  top: 24px;
  bottom: 0;
  width: 1px;
  background: rgba(255,255,255,.12);
}
.tl-item:last-child::before { display: none; }
.tl-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  border: 1px solid rgba(99,216,255,.36);
  background: rgba(8,16,22,.9);
  color: var(--cyan);
  font-size: 11px;
  font-weight: 700;
  z-index: 1;
}
.tl-body h4 { margin-bottom: 4px; }
.tl-body time { font-size: 12.5px; color: rgba(225,230,232,.52); display: block; margin-bottom: 6px; }
.tl-body p { font-size: 14px; color: var(--muted); }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 18px;
  padding: 20px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: rgba(6,10,13,.5);
  margin-bottom: 28px;
}
.detail-grid .k { font-size: 12.5px; color: rgba(225,230,232,.55); margin-bottom: 4px; }
.detail-grid .v { font-size: 15px; color: var(--white); }

.prose-block { margin-bottom: 26px; }
.prose-block h3 { font-size: 16px; margin-bottom: 8px; }
.prose-block p { color: var(--muted); font-size: 15px; line-height: 1.66; white-space: pre-wrap; }

.attach-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.attach-list li {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.03);
  font-size: 13.5px;
  color: var(--muted);
}
.attach-list svg { width: 15px; height: 15px; }

/* ------------------------------------------------------------------
   FAQ / legal / NAC
   ------------------------------------------------------------------ */
.faq-item { border-bottom: 1px solid var(--border); }
.faq-item summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 20px 4px;
  cursor: pointer;
  font-family: var(--display);
  font-weight: 500;
  font-size: 16.5px;
  color: var(--white);
  list-style: none;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::after {
  content: "";
  flex: none;
  width: 11px; height: 11px;
  border-right: 1.6px solid var(--cyan);
  border-bottom: 1.6px solid var(--cyan);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform 220ms var(--ease);
}
.faq-item[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.faq-item .answer {
  padding: 0 4px 22px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.68;
  max-width: 72ch;
}

.legal { max-width: 78ch; }
.legal h2 { font-size: clamp(21px, 2vw, 25px); margin: 40px 0 12px; }
.legal p, .legal li { color: var(--muted); font-size: 15.2px; line-height: 1.72; }
.legal ul { padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }

.nac-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 26px 0; }
.nac-tile {
  padding: 26px 20px;
  border-radius: var(--radius);
  border: 1px solid rgba(99,216,255,.2);
  background: linear-gradient(155deg, rgba(14,28,38,.66), rgba(6,10,13,.82));
  text-align: center;
}
.nac-tile .t {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--white);
  margin-bottom: 6px;
}
.nac-tile .s { font-size: 13.5px; color: var(--muted); }

.bullet-list { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; color: var(--muted); font-size: 14.5px; }

/* ------------------------------------------------------------------
   Footer
   ------------------------------------------------------------------ */
.site-footer {
  position: relative;
  margin-top: clamp(60px, 8vh, 110px);
  border-top: 1px solid var(--border);
  background: rgba(4,6,8,.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.footer-grid {
  display: grid;
  gap: clamp(28px, 3.4vw, 48px);
  grid-template-columns: minmax(230px, 1.4fr) repeat(auto-fit, minmax(140px, 1fr));
  padding-block: clamp(44px, 6vh, 72px) 34px;
}

.footer-grid h4 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .05em;
  color: rgba(255,255,255,.9);
  margin-bottom: 14px;
}

.footer-links { display: flex; flex-direction: column; gap: 10px; }
.footer-links a, .footer-links button {
  font-size: 14px;
  color: rgba(225,230,232,.62);
  transition: color 160ms var(--ease);
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.footer-links a:hover, .footer-links button:hover { color: var(--white); }
.footer-links .disabled { opacity: .45; cursor: not-allowed; font-size: 14px; }

.footer-brand p { margin-top: 14px; font-size: 14px; color: var(--muted); max-width: 34ch; line-height: 1.6; }

.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  justify-content: space-between;
  align-items: center;
  padding-block: 22px;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 13.5px;
  color: rgba(225,230,232,.5);
}

/* ------------------------------------------------------------------
   Floating WhatsApp + demo banner + toasts
   ------------------------------------------------------------------ */
.wa-fab {
  position: fixed;
  right: clamp(16px, 2vw, 28px);
  bottom: clamp(16px, 2vw, 28px);
  z-index: 70;
  width: 52px; height: 52px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: 0 6px 22px rgba(0,0,0,.5);
  color: #7bf0b4;
  cursor: pointer;
  transition: transform 200ms var(--ease), border-color 200ms var(--ease);
}
.wa-fab:hover { transform: translateY(-2px); border-color: rgba(123,240,180,.4); }
.wa-fab[aria-disabled="true"] { opacity: .42; cursor: not-allowed; transform: none; }
.wa-fab svg { width: 24px; height: 24px; }

.demo-banner {
  position: relative;
  z-index: 61;
  background: rgba(40,30,14,.72);
  border-bottom: 1px solid rgba(255,196,120,.24);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  font-size: 13px;
  color: #ffd9a3;
}
.demo-banner .shell {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
  padding-block: 8px;
  line-height: 1.45;
}
.demo-banner svg { flex: none; width: 15px; height: 15px; }
.demo-banner code { font-size: 12px; background: rgba(0,0,0,.3); padding: 1px 5px; border-radius: 4px; }

.toast-wrap {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(420px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 13px 16px;
  border-radius: 12px;
  border: var(--glass-border);
  background: rgba(10,16,20,.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
  font-size: 14px;
  animation: toast-in 320ms var(--ease) both;
}
.toast svg { flex: none; width: 17px; height: 17px; margin-top: 2px; }
.toast--error { border-color: rgba(255,130,130,.36); }
.toast--error svg { color: #ff9a9a; }
.toast--success { border-color: rgba(123,240,180,.34); }
.toast--success svg { color: #7bf0b4; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ------------------------------------------------------------------
   Entrance motion
   ------------------------------------------------------------------ */
@keyframes rise-fade {
  from { opacity: 0; transform: translate3d(0, 10px, 0); }
  to { opacity: 1; transform: none; }
}
@keyframes rise-brand {
  from { opacity: 0; transform: translate3d(0, 7px, 0) scale(.96); }
  to { opacity: 1; transform: none; }
}
@keyframes line-reveal {
  from { transform: translate3d(0, 108%, 0); }
  to { transform: none; }
}
@keyframes soft-in {
  from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.988); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: no-preference) {
  .motion-pending .brand,
  .motion-pending .nav a,
  .motion-pending .header-cta > *,
  .motion-pending .menu-toggle,
  .motion-pending .hero .lede,
  .motion-pending .hero .btn-row .btn,
  .motion-pending .hero-note,
  .motion-pending .hero-visual { opacity: 0; }

  .motion-pending .hero h1 .line-reveal { transform: translate3d(0, 108%, 0); }

  .brand { animation: rise-brand 580ms var(--ease) 60ms both; }
  .nav a { animation: rise-fade 480ms var(--ease) both; }
  .nav a:nth-child(1) { animation-delay: 150ms; }
  .nav a:nth-child(2) { animation-delay: 185ms; }
  .nav a:nth-child(3) { animation-delay: 220ms; }
  .nav a:nth-child(4) { animation-delay: 255ms; }
  .nav a:nth-child(5) { animation-delay: 290ms; }
  .nav a:nth-child(6) { animation-delay: 325ms; }
  .nav a:nth-child(7) { animation-delay: 360ms; }

  .header-cta > * { animation: rise-fade 500ms var(--ease) both; }
  .header-cta > *:nth-child(1) { animation-delay: 300ms; }
  .header-cta > *:nth-child(2) { animation-delay: 340ms; }
  .header-cta > *:nth-child(3) { animation-delay: 380ms; }
  .menu-toggle { animation: rise-fade 500ms var(--ease) 260ms both; }

  .hero h1 .line-one .line-reveal { animation: line-reveal 820ms cubic-bezier(.22,1,.36,1) 320ms both; }
  .hero h1 .line-two .line-reveal { animation: line-reveal 860ms cubic-bezier(.22,1,.36,1) 450ms both; }
  .hero .lede { animation: rise-fade 620ms var(--ease) 720ms both; }
  .hero .btn-row .btn:nth-child(1) { animation: rise-fade 560ms var(--ease) 900ms both; }
  .hero .btn-row .btn:nth-child(2) { animation: rise-fade 560ms var(--ease) 990ms both; }
  .hero-note { animation: rise-fade 560ms var(--ease) 1060ms both; }
  .hero-visual { animation: soft-in 900ms cubic-bezier(.22,1,.36,1) 1040ms both; }

  .reveal { opacity: 0; transform: translate3d(0, 16px, 0); }
  .reveal.in-view {
    opacity: 1;
    transform: none;
    transition: opacity 620ms var(--ease), transform 620ms var(--ease);
  }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-delay: 0ms !important;
    transition-duration: .001ms !important;
  }
}

/* ------------------------------------------------------------------
   Responsive
   ------------------------------------------------------------------ */
@media (max-width: 1080px) {
  .hero { grid-template-columns: 1fr; gap: 40px; }
  .hero-visual { max-width: 560px; }
}

@media (max-width: 960px) {
  .menu-toggle { display: grid; }

  .header-panel {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    left: auto;
    flex: none;
    width: min(340px, calc(100vw - var(--gutter) * 2));
    flex-direction: column;
    align-items: stretch;
    gap: 20px;
    padding: 22px;
    border-radius: 18px;
    border: var(--glass-border);
    background: linear-gradient(150deg, rgba(20,26,30,.9), rgba(5,9,12,.95));
    backdrop-filter: blur(20px) saturate(112%);
    -webkit-backdrop-filter: blur(20px) saturate(112%);
    box-shadow: 0 18px 44px rgba(0,0,0,.6);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(.985);
    transform-origin: 100% 0;
    transition: opacity 220ms var(--ease), transform 260ms var(--ease), visibility 0s linear 260ms;
  }

  .site-header.menu-open .header-panel {
    opacity: 1;
    visibility: visible;
    transform: none;
    transition: opacity 240ms var(--ease), transform 300ms var(--ease), visibility 0s;
  }

  .nav { flex-direction: column; align-items: stretch; gap: 2px; }
  .nav a { padding: 10px 2px; font-size: 15.5px; }
  .nav a[aria-current="page"]::after { bottom: 4px; right: auto; width: 26px; }

  .header-cta {
    margin-left: 0;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .header-cta .btn { width: 100%; }
}

@media (max-width: 620px) {
  body { font-size: 15.5px; }
  h1 { font-size: clamp(33px, 9.6vw, 46px); }
  .hero { padding-block: 34px 48px; }
  .sub-row { grid-template-columns: 1fr; }
  .sub-row .right { align-items: center; flex-direction: row; justify-content: space-between; width: 100%; }
  .dash-head { align-items: flex-start; }
  .btn-row .btn { flex: 1 1 100%; }
  .form-actions .btn { flex: 1 1 100%; }
  .btn--quiet { flex: 0 1 auto; }
}

@media (max-width: 380px) {
  :root { --gutter: 16px; }
}
</style>
</head>

<script>
/* ==================================================================
   NASOFT — application
   ------------------------------------------------------------------
   Layer separation:
     CONFIG        centralised configuration placeholders
     Auth          pluggable authentication adapter
     Data          pluggable submission/data adapter
     api           thin client that talks to YOUR server routes
     views         pure render functions
     router        hash routing + route guards
   No backend secret ever appears in this file.
   ================================================================== */
(function () {
  'use strict';

  /* ================================================================
     1. CONFIGURATION
     ----------------------------------------------------------------
     Replace the empty strings at deploy time. Anything left empty
     renders its UI in a clearly disabled state rather than
     pretending to work.

     N8N_WEBHOOK_URL and DATABASE_URL are deliberately ABSENT here.
     They belong in server-side environment variables only.
     ================================================================ */
  var CONFIG = {
    NASOFT_DOMAIN:   'nasoft.it',
    NASOFT_EMAIL:    '',   // [ADD_LATER]
    WHATSAPP_NUMBER: '',   // [ADD_LATER] digits only, including country code
    INSTAGRAM_URL:   '',   // [ADD_LATER]
    NAC_WEBSITE_URL: '',   // [ADD_LATER]
    AUTH_PROVIDER:   '',   // [ADD_LATER] e.g. 'supabase' | 'auth0' | 'custom'
    API_BASE:        '/api'
  };

  /* The wordmark is embedded once, on the header <img>; everything else
     reuses that same data URI instead of duplicating it. */
  var LOGO_SRC = (document.getElementById('brand-logo') || {}).src || '';

  var WHATSAPP_MESSAGE = 'Hi NASOFT! I would like to discuss a problem or idea with your team.';

  var CATEGORIES = ['Business', 'Education', 'Research', 'Strategy', 'Organization', 'Idea', 'Innovation', 'Other'];

  var STATUSES = {
    SUBMITTED:         { label: 'Submitted',         cls: 'submitted', glyph: '\u2022' },

    NEEDS_INFORMATION: { label: 'Needs information', cls: 'needsinfo', glyph: '!' },
    ACCEPTED:          { label: 'Accepted',          cls: 'accepted',  glyph: '\u2713' },
    IN_PROGRESS:       { label: 'In progress',       cls: 'progress',  glyph: '\u25D1' },
    WAITING_FOR_USER:  { label: 'Waiting for you',   cls: 'waiting',   glyph: '!' },
    RESOLVED:          { label: 'Resolved',          cls: 'resolved',  glyph: '\u2713' },
    CLOSED:            { label: 'Closed',            cls: 'closed',    glyph: '\u00D7' }
  };

  var UPLOAD_RULES = {
    accept: '.pdf,.doc,.docx,.txt,.rtf,.png,.jpg,.jpeg,.webp,.csv,.xlsx,.zip',
    maxBytes: 10 * 1024 * 1024,
    maxFiles: 5,
    human: 'PDF, DOC, DOCX, TXT, RTF, PNG, JPG, WEBP, CSV, XLSX, ZIP \u2014 up to 10 MB each, 5 files maximum.'
  };

  /* ================================================================
     2. UTILITIES
     ================================================================ */
  function h(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function qs(sel, root) { return (root || document).querySelector(sel); }
  function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); }
    catch (e) { return iso; }
  }

  function fmtDateTime(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return iso; }
  }

  function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()); }

  /* ================================================================
     3. AUTH PROVIDER (adapter)
     ----------------------------------------------------------------
     The ONLY place auth is implemented. To move to a real backend,
     write an object with the same method signatures and assign it
     to `Auth`. Nothing else in the app changes.

     Every method returns a Promise and throws Error(message) on
     failure. Identity always comes from the provider, never from a
     user-supplied field.
     ================================================================ */
  var DEMO_MODE = !CONFIG.AUTH_PROVIDER;

  var store = {
    read: function (key, fallback) {
      try {
        var raw = localStorage.getItem('nasoft.' + key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    },
    write: function (key, value) {
      try { localStorage.setItem('nasoft.' + key, JSON.stringify(value)); } catch (e) {}
    },
    remove: function (key) {
      try { localStorage.removeItem('nasoft.' + key); } catch (e) {}
    }
  };

  /* PBKDF2 so no plaintext password is ever persisted, even here. */
  function toHex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }

  function randomHex(bytes) {
    var a = new Uint8Array(bytes);
    crypto.getRandomValues(a);
    return toHex(a.buffer);
  }

  function hashPassword(password, saltHex) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (key) {
        return crypto.subtle.deriveBits({
          name: 'PBKDF2',
          salt: enc.encode(saltHex),
          iterations: 150000,
          hash: 'SHA-256'
        }, key, 256);
      })
      .then(toHex);
  }

  var DemoAuthProvider = {
    id: 'demo',

    _users: function () { return store.read('users', []); },
    _saveUsers: function (u) { store.write('users', u); },

    currentUser: function () {
      var session = store.read('session', null);
      if (!session) return null;
      if (session.expiresAt && Date.now() > session.expiresAt) {
        store.remove('session');
        return null;
      }
      var user = this._users().filter(function (u) { return u.user_id === session.user_id; })[0];
      if (!user) { store.remove('session'); return null; }
      return {
        user_id: user.user_id,
        name: user.name,
        email: user.email,
        email_verified: user.email_verified,
        phone: user.phone || '',
        created_at: user.created_at,
        updated_at: user.updated_at
      };
    },

    _startSession: function (user_id) {
      store.write('session', {
        user_id: user_id,
        token: randomHex(24),
        expiresAt: Date.now() + 1000 * 60 * 60 * 24 * 14
      });
    },

    register: function (input) {
      var self = this;
      return delay(520).then(function () {
        var users = self._users();
        var email = String(input.email).trim().toLowerCase();
        if (users.some(function (u) { return u.email === email; })) {
          throw new Error('An account already exists for this email address.');
        }
        var salt = randomHex(16);
        return hashPassword(input.password, salt).then(function (hash) {
          var now = new Date().toISOString();
          var user = {
            user_id: 'usr_' + randomHex(8),
            name: String(input.name).trim(),
            email: email,
            email_verified: false,
            phone: String(input.phone || '').trim(),
            password_salt: salt,
            password_hash: hash,
            verify_token: randomHex(10),
            reset_token: null,
            created_at: now,
            updated_at: now
          };
          users.push(user);
          self._saveUsers(users);
          /* A real provider emails this. The demo surfaces it so the
             flow can be completed end to end. */
          return { user_id: user.user_id, email: user.email, verification_token: user.verify_token };
        });
      });
    },

    verifyEmail: function (token) {
      var self = this;
      return delay(420).then(function () {
        var users = self._users();
        var user = users.filter(function (u) { return u.verify_token === token; })[0];
        if (!user) throw new Error('This verification link is invalid or has already been used.');
        if (user.pending_email) { user.email = user.pending_email; user.pending_email = null; }
        user.email_verified = true;
        user.verify_token = null;
        user.updated_at = new Date().toISOString();
        self._saveUsers(users);
        self._startSession(user.user_id);
        return true;
      });
    },

    resendVerification: function (email) {
      var self = this;
      return delay(380).then(function () {
        var users = self._users();
        var user = users.filter(function (u) { return u.email === String(email).trim().toLowerCase(); })[0];
        if (!user || user.email_verified) return null;
        user.verify_token = user.verify_token || randomHex(10);
        self._saveUsers(users);
        return user.verify_token;
      });
    },

    login: function (email, password) {
      var self = this;
      return delay(560).then(function () {
        var users = self._users();
        var user = users.filter(function (u) { return u.email === String(email).trim().toLowerCase(); })[0];
        /* Same message for unknown email and wrong password — no account enumeration. */
        if (!user) throw new Error('Email or password is incorrect.');
        return hashPassword(password, user.password_salt).then(function (hash) {
          if (hash !== user.password_hash) throw new Error('Email or password is incorrect.');
          if (!user.email_verified) {
            var err = new Error('Please verify your email address before signing in.');
            err.code = 'EMAIL_UNVERIFIED';
            err.email = user.email;
            throw err;
          }
          self._startSession(user.user_id);
          return self.currentUser();
        });
      });
    },

    logout: function () {
      store.remove('session');
      return Promise.resolve(true);
    },

    requestPasswordReset: function (email) {
      var self = this;
      return delay(520).then(function () {
        var users = self._users();
        var user = users.filter(function (u) { return u.email === String(email).trim().toLowerCase(); })[0];
        if (!user) return null;            // never reveal whether the account exists
        user.reset_token = randomHex(10);
        self._saveUsers(users);
        return user.reset_token;
      });
    },

    resetPassword: function (token, password) {
      var self = this;
      return delay(520).then(function () {
        var users = self._users();
        var user = users.filter(function (u) { return u.reset_token && u.reset_token === token; })[0];
        if (!user) throw new Error('This reset link is invalid or has expired.');
        var salt = randomHex(16);
        return hashPassword(password, salt).then(function (hash) {
          user.password_salt = salt;
          user.password_hash = hash;
          user.reset_token = null;
          user.updated_at = new Date().toISOString();
          self._saveUsers(users);
          return true;
        });
      });
    },

    updateProfile: function (patch) {
      var self = this;
      return delay(480).then(function () {
        var me = self.currentUser();
        if (!me) throw new Error('Your session has expired. Please sign in again.');
        var users = self._users();
        var user = users.filter(function (u) { return u.user_id === me.user_id; })[0];
        if (patch.name != null) user.name = String(patch.name).trim();
        if (patch.phone != null) user.phone = String(patch.phone).trim();
        user.updated_at = new Date().toISOString();
        self._saveUsers(users);
        return self.currentUser();
      });
    },

    requestEmailChange: function (newEmail) {
      var self = this;
      return delay(480).then(function () {
        var me = self.currentUser();
        if (!me) throw new Error('Your session has expired. Please sign in again.');
        var email = String(newEmail).trim().toLowerCase();
        var users = self._users();
        if (users.some(function (u) { return u.email === email && u.user_id !== me.user_id; })) {
          throw new Error('That email address is already in use.');
        }
        var user = users.filter(function (u) { return u.user_id === me.user_id; })[0];
        user.pending_email = email;
        user.verify_token = randomHex(10);
        self._saveUsers(users);
        return user.verify_token;
      });
    },

    changePassword: function (currentPassword, newPassword) {
      var self = this;
      return delay(620).then(function () {
        var me = self.currentUser();
        if (!me) throw new Error('Your session has expired. Please sign in again.');
        var users = self._users();
        var user = users.filter(function (u) { return u.user_id === me.user_id; })[0];
        return hashPassword(currentPassword, user.password_salt).then(function (hash) {
          if (hash !== user.password_hash) throw new Error('Your current password is incorrect.');
          var salt = randomHex(16);
          return hashPassword(newPassword, salt).then(function (nh) {
            user.password_salt = salt;
            user.password_hash = nh;
            user.updated_at = new Date().toISOString();
            self._saveUsers(users);
            return true;
          });
        });
      });
    }
  };

  /* ================================================================
     4. DATA PROVIDER (adapter)
     ----------------------------------------------------------------
     Submissions are always scoped to Auth.currentUser(). No method
     accepts a caller-supplied user_id. A server implementation must
     enforce the same rule.
     ================================================================ */
  function makeReference() {
    var year = new Date().getFullYear();
    var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var out = '';
    var rand = new Uint8Array(8);
    crypto.getRandomValues(rand);
    for (var i = 0; i < 8; i++) out += chars[rand[i] % chars.length];
    return 'NAS-' + year + '-' + out;
  }

  var DemoDataProvider = {
    _all: function () { return store.read('submissions', []); },
    _save: function (s) { store.write('submissions', s); },

    list: function () {
      var me = Auth.currentUser();
      if (!me) return Promise.reject(new Error('Your session has expired. Please sign in again.'));
      return delay(340).then(function () {
        return DemoDataProvider._all()
          .filter(function (s) { return s.user_id === me.user_id; })
          .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      });
    },

    get: function (submission_id) {
      var me = Auth.currentUser();
      if (!me) return Promise.reject(new Error('Your session has expired. Please sign in again.'));
      return delay(300).then(function () {
        var s = DemoDataProvider._all().filter(function (x) { return x.submission_id === submission_id; })[0];
        /* A record belonging to someone else reads as not found — never
           as "forbidden but exists". */
        if (!s || s.user_id !== me.user_id) {
          var err = new Error('We could not find that submission in your account.');
          err.code = 'NOT_FOUND';
          throw err;
        }
        return s;
      });
    },

    create: function (input) {
      var me = Auth.currentUser();
      if (!me) return Promise.reject(new Error('Your session has expired. Please sign in again.'));
      return delay(900).then(function () {
        var now = new Date().toISOString();
        var record = {
          submission_id: makeReference(),
          user_id: me.user_id,           // from session, not from the form
          submitter_name: me.name,
          submitter_email: me.email,     // verified account email
          kind: input.kind || 'problem',
          category: input.category,
          title: input.title,
          description: input.description,
          desired_outcome: input.desired_outcome,
          problem_solved: input.problem_solved || '',
          attachments: input.attachments || [],
          status: 'SUBMITTED',
          created_at: now,
          updated_at: now,
          status_history: [
            { status: 'SUBMITTED', message: 'Submission received by NASOFT.', created_at: now }
          ],
          messages: []
        };
        var all = DemoDataProvider._all();
        all.push(record);
        DemoDataProvider._save(all);
        return record;
      });
    },

    respond: function (submission_id, message) {
      var me = Auth.currentUser();
      if (!me) return Promise.reject(new Error('Your session has expired. Please sign in again.'));
      return delay(620).then(function () {
        var all = DemoDataProvider._all();
        var s = all.filter(function (x) { return x.submission_id === submission_id; })[0];
        if (!s || s.user_id !== me.user_id) throw new Error('We could not find that submission in your account.');
        var now = new Date().toISOString();
        s.messages.push({ message_id: 'msg_' + randomHex(6), sender_type: 'user', message: message, created_at: now });
        s.updated_at = now;
        DemoDataProvider._save(all);
        return s;
      });
    }
  };

  function setBusy(form, busy, busyLabel) {

    qsa('input, select, textarea, button', form).forEach(function (el) { el.disabled = busy; });

  function collectAttachments(input) {
    if (!input || !input.files || !input.files.length) return { ok: true, files: [] };
    var files = Array.prototype.slice.call(input.files);
    if (files.length > UPLOAD_RULES.maxFiles) {
      return { ok: false, error: 'Please attach no more than ' + UPLOAD_RULES.maxFiles + ' files.' };
    }
    var tooBig = files.filter(function (f) { return f.size > UPLOAD_RULES.maxBytes; });
    if (tooBig.length) return { ok: false, error: '\u201c' + tooBig[0].name + '\u201d is larger than 10 MB.' };
    return {
      ok: true,
      files: files.map(function (f) {
        return { name: f.name, size: f.size, type: f.type || 'application/octet-stream' };
      })
    };
  }

  function wireSubmissionForm(formId, kind) {
    var form = qs('#' + formId);
    if (!form) return;

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors(form);
      formAlert(form, null, null);

      var get = function (id) { var el = qs('#' + id, form); return el ? el.value.trim() : ''; };
      var valid = true;

      if (kind === 'problem' && !get('category')) { setFieldError(form, 'category', 'Choose a category.'); valid = false; }
      if (!get('title')) { setFieldError(form, 'title', 'Give the submission a title.'); valid = false; }
      else if (get('title').length < 4) { setFieldError(form, 'title', 'The title is too short to be useful.'); valid = false; }
      if (get('description').length < 30) { setFieldError(form, 'description', 'Please describe this in at least a few sentences.'); valid = false; }
      if (kind === 'idea' && get('problem_solved').length < 10) { setFieldError(form, 'problem_solved', 'Describe the problem this idea responds to.'); valid = false; }
      if (get('desired_outcome').length < 10) { setFieldError(form, 'desired_outcome', 'Tell us what you would like to achieve.'); valid = false; }

      var att = collectAttachments(qs('#attachments', form));
      if (!att.ok) { setFieldError(form, 'attachments', att.error); valid = false; }

      if (!valid) {
        var firstBad = qs('[aria-invalid="true"]', form);
        if (firstBad) firstBad.focus();
        return;
      }

      setBusy(form, true, 'Submitting\u2026');

      Data.create({
        kind: kind,
        category: kind === 'idea' ? 'Idea' : get('category'),
        title: get('title'),
        description: get('description'),
        desired_outcome: get('desired_outcome'),
        problem_solved: kind === 'idea' ? get('problem_solved') : '',
        attachments: att.files
      }).then(function (record) {
        /* A configured deployment also notifies the backend here:
             api.post('/submit-' + kind, { submission_id: record.submission_id })
           The server attaches identity and forwards to n8n. */
        renderSuccess(record);
      }).catch(function (err) {
        setBusy(form, false);
        formAlert(form, 'error', err.message || 'Something went wrong. Please try again.');
        toast('Something went wrong. Please try again.', 'error');
      });
    });
  }

  function renderSuccess(record) {
    var slot = qs('#submit-slot') || qs('#idea-slot');

    slot.innerHTML =

  function wireLogin() {
    var form = qs('#login-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors(form); formAlert(form, null, null);
      var email = qs('#email', form).value.trim();
      var password = qs('#password', form).value;
      var ok = true;
      if (!isEmail(email)) { setFieldError(form, 'email', 'Enter a valid email address.'); ok = false; }
      if (!password) { setFieldError(form, 'password', 'Enter your password.'); ok = false; }
      if (!ok) return;

      setBusy(form, true, 'Signing in\u2026');
      Auth.login(email, password).then(function (user) {
        toast('Signed in as ' + user.email, 'success');
        var next = sessionStorage.getItem('nasoft.next') || '#/dashboard';
        sessionStorage.removeItem('nasoft.next');
        location.hash = next;
      }).catch(function (err) {
        setBusy(form, false);
        if (err.code === 'EMAIL_UNVERIFIED') {
          formAlert(form, 'warn', err.message);
          Auth.resendVerification(err.email).then(function (token) {
            if (token) showVerifyHint(form, token);
          });
        } else {
          formAlert(form, 'error', err.message);
        }
      });
    });
  }

  /* Demo-only: surfaces the token a real deployment would email. */
  function showVerifyHint(form, token) {
    if (!DEMO_MODE) return;

    slot.insertAdjacentHTML('beforeend',
      '<div class="notice notice--warn" style="margin-top:12px">' + icon('alert') +
      '<span><strong>Demo mode:</strong> no email is actually sent. ' +
      '<a href="#/verify-email?token=' + h(token) + '" style="color:var(--cyan);text-decoration:underline">Open the verification link</a></span></div>');
  }

  function wireRegister() {
    var form = qs('#register-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors(form); formAlert(form, null, null);
      var v = function (id) { return qs('#' + id, form).value; };
      var ok = true;
      if (v('name').trim().length < 2) { setFieldError(form, 'name', 'Enter your full name.'); ok = false; }
      if (!isEmail(v('email'))) { setFieldError(form, 'email', 'Enter a valid email address.'); ok = false; }
      if (v('password').length < 10) { setFieldError(form, 'password', 'Use at least 10 characters.'); ok = false; }
      if (v('confirm') !== v('password')) { setFieldError(form, 'confirm', 'Passwords do not match.'); ok = false; }
      if (!ok) { var b = qs('[aria-invalid="true"]', form); if (b) b.focus(); return; }

      setBusy(form, true, 'Creating account\u2026');
      Auth.register({ name: v('name'), email: v('email'), password: v('password'), phone: v('phone') })
        .then(function (res) {
          toast('Account created. Verify your email to activate it.', 'success');
          location.hash = '#/verify-email' + (DEMO_MODE ? '?token=' + res.verification_token : '');
        })
        .catch(function (err) {
          setBusy(form, false);
          formAlert(form, 'error', err.message);
        });
    });
  }

  function renderDetail(s) {

            ? '<ul class="attach-list">' + s.attachments.map(function (f) {
                return '<li>' + icon('file') + h(f.name) + '</li>';
              }).join('') + '</ul>'
            : '<p>No attachments.</p>') +
        '</div>' +

        (needsInfo
          ? '<div style="margin:26px 0">' +
              noticeBlock('warn', '<strong>NASOFT needs more information</strong> \u2014 add what is missing below and it will be attached to this submission.') +
              '<form class="form" id="respond-form" novalidate style="margin-top:18px">' +
                '<div data-form-alert></div>' +
                fieldMarkup({ id: 'response', label: 'Your response', type: 'textarea', rows: 5, required: true, placeholder: 'Add the information NASOFT asked for.' }) +

              '</form>' +
            '</div>'
          : '') +

        '<h3 style="margin:30px 0 18px">Progress</h3>' +
        '<div class="timeline">' + (s.status_history || []).map(function (ev, i) {
          return '<div class="tl-item">' +
            '<span class="tl-dot" aria-hidden="true">' + (i + 1) + '</span>' +
            '<div class="tl-body">' +
              '<h4>' + h(TIMELINE_LABELS[ev.status] || ev.status) + '</h4>' +
              '<time datetime="' + h(ev.created_at) + '">' + h(fmtDateTime(ev.created_at)) + '</time>' +
              (ev.message ? '<p>' + h(ev.message) + '</p>' : '') +
            '</div>' +
          '</div>';

          : '') +

          renderDetail(updated);

          setBusy(rf, false);

        });
      });
    }
  }

        '</div>' +
      '</section>',
      mount: function () {
        qs('#name').value = me.name;
        qs('#phone').value = me.phone || '';

        var pf = qs('#profile-form');
        pf.addEventListener('submit', function (e) {
          e.preventDefault();
          clearErrors(pf); formAlert(pf, null, null);
          var name = qs('#name', pf).value.trim();
          if (name.length < 2) { setFieldError(pf, 'name', 'Enter your full name.'); return; }
          setBusy(pf, true, 'Saving\u2026');
          Auth.updateProfile({ name: name, phone: qs('#phone', pf).value })
            .then(function () { setBusy(pf, false); formAlert(pf, 'success', 'Your details were saved.'); renderChrome(); })
            .catch(function (err) { setBusy(pf, false); formAlert(pf, 'error', err.message); });
        });

        var ef = qs('#email-form');
        ef.addEventListener('submit', function (e) {
          e.preventDefault();
          clearErrors(ef); formAlert(ef, null, null);
          var v = qs('#new_email', ef).value.trim();
          if (!isEmail(v)) { setFieldError(ef, 'new_email', 'Enter a valid email address.'); return; }
          setBusy(ef, true, 'Sending\u2026');
          Auth.requestEmailChange(v).then(function (token) {
            setBusy(ef, false);
            formAlert(ef, 'success', 'Check the new address for a verification link. Your login stays the same until it is verified.');
            if (DEMO_MODE && token) showVerifyHint(ef, token);
          }).catch(function (err) { setBusy(ef, false); formAlert(ef, 'error', err.message); });
        });

        var wf = qs('#password-form');
        wf.addEventListener('submit', function (e) {
          e.preventDefault();
          clearErrors(wf); formAlert(wf, null, null);
          var cur = qs('#current_password', wf).value, nw = qs('#new_password', wf).value;
          if (!cur) { setFieldError(wf, 'current_password', 'Enter your current password.'); return; }
          if (nw.length < 10) { setFieldError(wf, 'new_password', 'Use at least 10 characters.'); return; }
          setBusy(wf, true, 'Updating\u2026');
          Auth.changePassword(cur, nw).then(function () {
            setBusy(wf, false);
            qs('#current_password', wf).value = '';
            qs('#new_password', wf).value = '';
            formAlert(wf, 'success', 'Your password was updated.');
          }).catch(function (err) { setBusy(wf, false); formAlert(wf, 'error', err.message); });
        });

        qs('#logout-btn').addEventListener('click', function () {
          Auth.logout().then(function () {
            toast('Signed out.', 'success');
            location.hash = '#/';
            renderChrome();
          });
        });
      }
    };
  };

  /* ---- Legal ------------------------------------------------------- */
  views.privacy = function () {
    return {
      title: 'Privacy — NASOFT',
      html:
      '<section class="shell section"><div class="legal">' +
        '<span class="eyebrow">Legal</span>' +
        '<h1 style="font-size:clamp(32px,4vw,48px);margin-top:14px">Privacy</h1>' +
        '<p style="margin-top:16px">This page describes how NASOFT handles the information you provide. It is a working draft and should be reviewed by qualified legal counsel before launch.</p>' +
        '<h2>What we collect</h2>' +

  };

  views.terms = function () {
    return {
      title: 'Terms — NASOFT',
      html:
      '<section class="shell section"><div class="legal">' +
        '<span class="eyebrow">Legal</span>' +
        '<h1 style="font-size:clamp(32px,4vw,48px);margin-top:14px">Terms</h1>' +
        '<p style="margin-top:16px">These terms govern use of the NASOFT website. They are a working draft and should be reviewed by qualified legal counsel before launch.</p>' +

        '<h2>Changes</h2>' +

      '</div></section>'
    };
  };

  /* ---- Error views -------------------------------------------------- */
  views.notFound = function () {
    return {
      title: 'Page not found — NASOFT',
      html:
      '<section class="shell section"><div class="auth-shell glass panel" style="text-align:center">' +
        '<h1 style="font-size:clamp(46px,7vw,74px);margin-bottom:8px">404</h1>' +
        '<h2 style="font-size:22px;margin-bottom:12px">We couldn\u2019t find that page.</h2>' +
        '<p class="lede" style="margin-inline:auto">The link may be out of date, or the page may have moved.</p>' +
        '<div class="btn-row" style="justify-content:center;margin-top:24px">' +
          '<a class="btn btn--primary" href="#/">Go home</a>' +
          '<a class="btn btn--ghost" href="#/contact">Contact NASOFT</a>' +
        '</div>' +
      '</div></section>'
    };
  };

  views.unauthorized = function (nextHash) {
    return {
      title: 'Sign in required — NASOFT',
      html:
      '<section class="shell section"><div class="auth-shell glass panel">' +
        noticeBlock('warn', 'You need to be signed in to view that page.') +
        '<h2 style="margin:22px 0 10px">Sign in to continue</h2>' +
        '<p class="lede" style="font-size:15px">Your submissions are private to your account, so we need to know who you are.</p>' +
        '<div class="btn-row" style="margin-top:22px">' +
          '<a class="btn btn--primary" href="#/login">Sign In</a>' +
          '<a class="btn btn--ghost" href="#/register">Create Account</a>' +
        '</div>' +
      '</div></section>',
      mount: function () { if (nextHash) sessionStorage.setItem('nasoft.next', nextHash); }
    };
  };

  /* ================================================================
     8. CHROME — header + footer, re-rendered on auth change
     ================================================================ */
  function renderChrome() {
    var me = Auth.currentUser();
    var current = location.hash || '#/';

    qs('#primary-nav').innerHTML = NAV_ITEMS.map(function (i) {
      var active = (i.href === current) || (i.href === '#/' && (current === '' || current === '#'));
      return '<a href="' + i.href + '"' + (active ? ' aria-current="page"' : '') + '>' + h(i.label) + '</a>';
    }).join('');

    qs('#header-cta').innerHTML = me
      ? '<a class="btn btn--ghost btn--sm" href="#/submit">Submit a Problem</a>' +
        '<a class="btn btn--ghost btn--sm" href="#/dashboard">Dashboard</a>' +
        '<a class="btn btn--primary btn--sm" href="#/profile">' + h(me.name.split(' ')[0]) + '</a>'
      : '<a class="btn btn--ghost btn--sm" href="#/submit">Submit a Problem</a>' +
        '<a class="btn btn--quiet btn--sm" href="#/login">Sign In</a>' +
        '<a class="btn btn--primary btn--sm" href="#/register">Create Account</a>';

    renderFooter(me);
    renderDemoBanner();
    renderWaFab();
  }

  function renderFooter(me) {
    var wa = whatsappHref();
    var mail = CONFIG.NASOFT_EMAIL ? 'mailto:' + CONFIG.NASOFT_EMAIL : null;

    function fLink(href, label, placeholder) {
      if (href) {
        return '<a href="' + h(href) + '"' +
          (href.charAt(0) === '#' ? '' : ' target="_blank" rel="noopener noreferrer"') + '>' + h(label) + '</a>';
      }
      return '<span class="disabled" aria-disabled="true" title="' + h(placeholder) + ' is not configured yet">' + h(label) + '</span>';
    }

    qs('#site-footer').innerHTML =
    '<div class="shell footer-grid">' +
      '<div class="footer-brand">' +
        '<a class="brand brand--footer" href="#/" aria-label="NASOFT home">' +
          '<img src="' + LOGO_SRC + '" alt="NASOFT" decoding="async">' +
        '</a>' +
        '<p>An organization built around problems, ideas, exploration, and solutions.</p>' +
      '</div>' +
      '<div><h4>Navigate</h4><div class="footer-links">' +
        NAV_ITEMS.map(function (i) { return '<a href="' + i.href + '">' + h(i.label) + '</a>'; }).join('') +
        '<a href="#/faq">FAQ</a>' +
      '</div></div>' +
      '<div><h4>Account</h4><div class="footer-links">' +
        (me ? '<a href="#/dashboard">Dashboard</a><a href="#/profile">Profile</a><button type="button" data-logout>Sign out</button>'
            : '<a href="#/login">Sign In</a><a href="#/register">Create Account</a><a href="#/dashboard">Dashboard</a>') +
      '</div></div>' +
      '<div><h4>Education</h4><div class="footer-links">' +
        '<a href="#/education">Novaris Assessment Council</a>' +
        fLink(CONFIG.NAC_WEBSITE_URL, 'NAC website', 'NAC_WEBSITE_URL') +
      '</div></div>' +
      '<div><h4>Connect</h4><div class="footer-links">' +
        fLink(wa, 'WhatsApp', 'WHATSAPP_NUMBER') +
        fLink(CONFIG.INSTAGRAM_URL, 'Instagram', 'INSTAGRAM_URL') +
        fLink(mail, 'Email', 'NASOFT_EMAIL') +
      '</div></div>' +
    '</div>' +
    '<div class="shell footer-bottom">' +
      '<span>\u00a9 2026 NASOFT. All rights reserved.</span>' +
      '<span class="footer-links" style="flex-direction:row;gap:20px">' +
        '<a href="#/privacy">Privacy</a><a href="#/terms">Terms</a>' +
        '<span style="opacity:.6">' + h(CONFIG.NASOFT_DOMAIN) + '</span>' +
      '</span>' +
    '</div>';

    var lo = qs('[data-logout]');
    if (lo) lo.addEventListener('click', function () {
      Auth.logout().then(function () { toast('Signed out.', 'success'); location.hash = '#/'; renderChrome(); });
    });
  }

  function renderDemoBanner() {
    var slot = qs('#demo-banner-slot');
    if (!DEMO_MODE) { slot.innerHTML = ''; return; }
    if (slot.dataset.rendered) return;
    slot.dataset.rendered = '1';
    slot.innerHTML = '<div class="demo-banner"><div class="shell">' + icon('alert') +
      '<span><strong>Demo mode.</strong> Accounts and submissions are stored in this browser only, and no emails are sent. ' +
      'Set <code>AUTH_PROVIDER</code> and connect the server API to enable real accounts.</span>' +
    '</div></div>';
  }

  function renderWaFab() {
    var fab = qs('#wa-fab');
    if (whatsappHref()) {
      fab.removeAttribute('aria-disabled');
      fab.title = 'Chat with NASOFT on WhatsApp';
    } else {
      fab.setAttribute('aria-disabled', 'true');
      fab.title = 'WhatsApp is not configured yet (WHATSAPP_NUMBER)';
    }
  }

  qs('#wa-fab').addEventListener('click', function () {
    var href = whatsappHref();
    if (!href) {
      toast('WhatsApp is not configured yet. Add WHATSAPP_NUMBER to enable it.', 'error');
      return;
    }
    window.open(href, '_blank', 'noopener');
  });

  /* ================================================================
     9. ROUTER
     ================================================================ */
  var ROUTES = {
    '/':                { view: views.home },
    '/what-we-solve':   { view: views.whatWeSolve },
    '/how-it-works':    { view: views.howItWorks },
    '/education':       { view: views.education },
    '/ideas':           { view: views.ideas },
    '/about':           { view: views.about },
    '/contact':         { view: views.contact },
    '/submit':          { view: views.submit },
    '/login':           { view: views.login,          guestOnly: true },
    '/register':        { view: views.register,       guestOnly: true },
    '/forgot-password': { view: views.forgotPassword, guestOnly: true },
    '/reset-password':  { view: views.resetPassword },
    '/verify-email':    { view: views.verifyEmail },
    '/dashboard':       { view: views.dashboard,      guarded: true },
    '/profile':         { view: views.profile,        guarded: true },
    '/faq':             { view: views.faq },
    '/privacy':         { view: views.privacy },
    '/terms':           { view: views.terms }
  };

  function parseHash() {
    var raw = (location.hash || '#/').slice(1) || '/';
    var qIndex = raw.indexOf('?');
    var path = qIndex === -1 ? raw : raw.slice(0, qIndex);
    var params = {};
    if (qIndex !== -1) {
      raw.slice(qIndex + 1).split('&').forEach(function (pair) {
        var kv = pair.split('=');
        params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
    }
    if (path.length > 1 && path.charAt(path.length - 1) === '/') path = path.slice(0, -1);
    return { path: path, params: params };
  }

  var observer = null;

  function render() {
    var parsed = parseHash();
    var me = Auth.currentUser();
    var page;

    var detail = parsed.path.match(/^\/submission\/([A-Za-z0-9-]+)$/);
    if (detail) {
      page = me ? views.submission({ id: detail[1] }) : views.unauthorized(location.hash);
    } else {
      var route = ROUTES[parsed.path];
      if (!route) {
        page = views.notFound();
      } else if (route.guarded && !me) {
        page = views.unauthorized(location.hash);
      } else if (route.guestOnly && me) {
        location.replace('#/dashboard');
        return;
      } else {
        page = route.view(parsed.params);
      }
    }

    document.title = page.title || 'NASOFT';
    var desc = qs('meta[name="description"]');
    if (desc && page.description) desc.setAttribute('content', page.description);

    var main = qs('#main');
    main.innerHTML = page.html;

    closeMenu();
    renderChrome();

    if (typeof page.mount === 'function') page.mount();

    if (observer) observer.disconnect();
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.add('in-view'); observer.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -12% 0px' });
      qsa('.reveal', main).forEach(function (el) { observer.observe(el); });
    } else {
      qsa('.reveal', main).forEach(function (el) { el.classList.add('in-view'); });
    }

    window.scrollTo(0, 0);
    main.focus({ preventScroll: true });
  }

  /* ================================================================
     10. HEADER MENU + SCROLL STATE
     ================================================================ */
  var header = qs('#site-header');
  var toggle = qs('#menu-toggle');
  var panel = qs('#header-panel');

  function menuActive() { return getComputedStyle(toggle).display !== 'none'; }

  function syncInert() {
    if (!menuActive()) { panel.removeAttribute('inert'); return; }
    if (header.classList.contains('menu-open')) panel.removeAttribute('inert');
    else panel.setAttribute('inert', '');
  }

  function openMenu() {
    header.classList.add('menu-open');
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', 'Close menu');
    syncInert();
    var first = qs('a', panel);
    if (first) first.focus({ preventScroll: true });
  }

  function closeMenu() {
    header.classList.remove('menu-open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Open menu');
    syncInert();
  }

  toggle.addEventListener('click', function (e) {
    e.stopPropagation();
    if (header.classList.contains('menu-open')) closeMenu(); else openMenu();
  });

  document.addEventListener('pointerdown', function (e) {
    if (!header.classList.contains('menu-open')) return;
    if (panel.contains(e.target) || toggle.contains(e.target)) return;
    closeMenu();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && header.classList.contains('menu-open')) {
      closeMenu();
      toggle.focus({ preventScroll: true });
    }
  });

  window.addEventListener('resize', function () {
    if (!menuActive()) closeMenu(); else syncInert();
  });

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      var y = window.scrollY;
      header.classList.toggle('is-stuck', y > 12);
      document.body.classList.toggle('scrolled-deep', y > window.innerHeight * 0.55);
      ticking = false;
    });
  }, { passive: true });

  /* ================================================================
     11. BACKGROUND MEDIA — performance guards
     ================================================================ */
  (function backgroundGuard() {
    var video = qs('#bg-video');
    if (!video) return;

    var conn = navigator.connection || {};
    var saveData = conn.saveData;
    var slow = /^(slow-)?2g$/.test(conn.effectiveType || '');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Data saver, 2G, or reduced motion: drop the video entirely and
       let the static gradient stand in. */
    if (saveData || slow || reduced) { video.remove(); return; }

    video.addEventListener('error', function () { video.remove(); });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) video.pause();
      else video.play().catch(function () {});
    });

    var p = video.play();
    if (p && p.catch) p.catch(function () { /* autoplay refused — fallback shows */ });
  })();

  /* ================================================================
     12. BOOT
     ================================================================ */
  window.addEventListener('hashchange', render);

  if (!location.hash) location.replace('#/');
  renderChrome();
  render();

  setTimeout(function () {
    document.documentElement.classList.remove('motion-pending');
    if (window.__motionFallback) { clearTimeout(window.__motionFallback); window.__motionFallback = null; }
  }, 2200);

})();
</script>
